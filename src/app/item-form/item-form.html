<form class="form" [formGroup]="form" (ngSubmit)="onSubmit()">
  <label for="title">Product name</label>
  <input id="title" type="text"
    placeholder="Enter product name" formControlName="title">

  <label for="price">Price</label>
  <input required min="0" id="price" type="number" placeholder="0.00" formControlName="price">

  <label for="description">Description</label>
  <textarea id="description" type="text"
    placeholder="Describe the product" formControlName="shortDescription"></textarea>

  <div class="actions">
    <button type="button">Cancel</button>
    <button type="submit" [disabled]="form.invalid">
      {{ editingMode ? 'Save Changes' : 'Add Product' }}
    </button>
  </div>
</form>
