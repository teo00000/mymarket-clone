<form (ngSubmit)="addItem()">
  <input type="text" [(ngModel)]="itemName" name="itemName">
  <button type="submit">Add</button>
</form>

<h1>Items</h1>

<div class="wrapper">
  @for (item of items; track item.id) {
  <div class="itemContainer">
    <li class="item-title">{{ item.title }}</li>
  </div>
  }
</div>

<pre>{{ items | json }}</pre>
