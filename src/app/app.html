<div class="main-container">
  <h1 class="items-header">Items</h1>

  <form (ngSubmit)="saveItem()" class="form">
    <input type="text" [(ngModel)]="formItem.title" name="itemName" placeholder="Add item">
    <input type="number" [(ngModel)]="formItem.price" name="itemPrice" placeholder="Enter price">
    <textarea type="text" [(ngModel)]="formItem.description" name="itemDescription"
      placeholder="Enter description"></textarea>
    
    <button type="submit">
      {{ editingMode ? 'Save' : 'Add' }}
    </button>
  </form>

  <div class="wrapper">
    @for (item of items; track item.id) {
    <div class="item-container">
      <li class="item-title">{{ item.title }}</li>

      <p>Price: {{ item.price }}$</p>
      <p>{{ item.description }}</p>

      <div class="buttons">
        <button (click)="editItem(item.id)">
          Edit
        </button>
        <button (click)="deleteItem(item.id)">
          Delete
        </button>
      </div>
    </div>
    }
  </div>

  <div class="info">
    <button routerLink="">Home</button>
    <button routerLink="/about">About</button>
    <button routerLink="/contact">Contact</button>
  </div>

  <router-outlet></router-outlet>

  <pre>{{ items | json }}</pre>
</div>
