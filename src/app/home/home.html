<section class="hero">
  <div class="hero-content">
    <p class="hero-label">WELCOME TO MYMARKET</p>

    <h1>
      Buy and sell
      <span>with ease.</span>
    </h1>

    <p class="hero-description">
      Discover great products, sell items you no longer need,
      and connect with your local marketplace.
    </p>
  </div>

  <div class="hero-visual">
    <div class="hero-card">
      <span class="hero-card-icon">🏪</span>

      <h2>Your marketplace</h2>

      <p>Discover. Sell. Connect.</p>
    </div>
  </div>
</section>

<div class="searchAndAdd">
    <input class="searchField" type="text" (input)="onSearch($event)" placeholder="🔍 Search">
    <button routerLink="/item-form" class="add-btn">+ Add Product</button>
</div>
<app-product-list [items]="filteredProducts()" (openDetails)="onOpenDetails($event)">

</app-product-list>
