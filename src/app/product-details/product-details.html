@if (product(); as item) {
<h1>{{ item.title }}</h1>
<p>Price: {{ item.price }}$</p>
<p>Description</p>
<p>{{ item.description }}</p>
<p>{{ item.availability ? "🟢 Available" : "🔴 Sold" }}</p>
<div class="buttons">
  <button [routerLink]="['/item-form', product()?.id]">
    Edit
  </button>
  <button (click)="onDelete(); $event.stopPropagation()">
    Delete
  </button>
</div>
} @else {
<p>Loading product details...</p>
}
